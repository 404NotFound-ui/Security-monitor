name: Security Data Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:

  collect:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Collect security data
        run: |
          python collector.py

      - name: Commit updated data
        run: |

          git config user.name "Security Monitor"
          git config user.email "security-monitor@users.noreply.github.com"

          git add data/security.json

          git diff --cached --quiet || \
            git commit -m "Update security data"

          git push
