name: Security Data Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: security-data-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run collector
        run: python collector.py

      - name: Commit updated data
        run: |
          git config user.name "Security Monitor"
          git config user.email "security-monitor@users.noreply.github.com"

          git add data/security.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update security data"

          git pull --rebase origin main

          git push origin main
