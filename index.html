<!DOCTYPE html>
<html lang="sv">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Security Monitor</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #070b12;
    color: #e6edf3;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

header {
    padding: 18px 24px;
    background: #0d131d;
    border-bottom: 1px solid #202938;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 2px;
}

#updated {
    color: #7d8998;
    font-size: 13px;
}

.container {
    padding: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.stat {
    background: #0d131d;
    border: 1px solid #202938;
    border-radius: 8px;
    padding: 16px;
}

.stat-title {
    color: #7d8998;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.stat-value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 7px;
}

.critical {
    color: #ff4d5a;
}

.high {
    color: #ff9f43;
}

.medium {
    color: #ffd166;
}

.kev {
    color: #ff4d5a;
}

.p1 {
    color: #ff4d5a;
}

.p2 {
    color: #ff9f43;
}

.news {
    color: #65b7ff;
}

.filters {
    background: #0d131d;
    border: 1px solid #202938;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 18px;
}

.filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
}

.filter-row:last-child {
    margin-bottom: 0;
}

.filter-label {
    color: #7d8998;
    font-size: 12px;
    width: 80px;
}

input,
select {
    background: #121a26;
    color: #dce5ee;
    border: 1px solid #283445;
    border-radius: 5px;
    padding: 7px 9px;
    font-size: 12px;
}

input {
    min-width: 220px;
}

button {
    background: #121a26;
    color: #b9c4d0;
    border: 1px solid #283445;
    border-radius: 5px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
}

button:hover {
    background: #192434;
    color: white;
}

button.active {
    background: #245b8a;
    border-color: #3b82bd;
    color: white;
}

button.active-danger {
    background: #6b2029;
    border-color: #a83a46;
    color: white;
}

.content {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 18px;
}

.panel {
    background: #0d131d;
    border: 1px solid #202938;
    border-radius: 8px;
    overflow: hidden;
}

.panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid #202938;
    font-weight: bold;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.panel-count {
    color: #7d8998;
    font-size: 12px;
    font-weight: normal;
}

.cve,
.news-item,
.alert {
    padding: 14px 16px;
    border-bottom: 1px solid #18202d;
}

.cve:last-child,
.news-item:last-child,
.alert:last-child {
    border-bottom: 0;
}

.cve-top,
.news-top,
.alert-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.cve-id,
.news-title {
    font-weight: bold;
    color: #65b7ff;
    text-decoration: none;
    font-size: 14px;
}

.cve-id:hover,
.news-title:hover {
    text-decoration: underline;
}

.news-title {
    font-size: 13px;
}

.news-summary,
.description,
.alert-description {
    color: #9aa7b6;
    font-size: 12px;
    margin-top: 8px;
    line-height: 1.45;
}

.meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 9px;
    color: #6f7d8d;
    font-size: 11px;
}

.meta-item {
    background: #111925;
    padding: 3px 6px;
    border-radius: 3px;
}

.badges {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.badge {
    padding: 3px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: bold;
    white-space: nowrap;
}

.badge-critical {
    background: #4b1720;
    color: #ff6b78;
}

.badge-high {
    background: #4b2c12;
    color: #ffad5c;
}

.badge-medium {
    background: #4a4012;
    color: #ffe083;
}

.badge-info {
    background: #152d43;
    color: #70b9ee;
}

.badge-kev {
    background: #641b24;
    color: #ff5968;
}

.badge-p1 {
    background: #641b24;
    color: #ff5968;
}

.badge-p2 {
    background: #4b2c12;
    color: #ffad5c;
}

.badge-p3 {
    background: #4a4012;
    color: #ffe083;
}

.badge-source {
    background: #17202d;
    color: #9daabd;
}

.empty {
    padding: 30px;
    color: #6f7d8d;
    text-align: center;
    font-size: 13px;
}

.error {
    padding: 20px;
    color: #ff6b78;
}

.section-title {
    margin-top: 22px;
    margin-bottom: 10px;
    color: #8c9aaa;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

@media(max-width: 1100px) {

    .stats {
        grid-template-columns: repeat(3, 1fr);
    }

    .content {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 650px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    header {
        display: block;
    }

    #updated {
        margin-top: 7px;
    }

    .filter-label {
        width: 100%;
    }

    input {
        width: 100%;
        min-width: 0;
    }
}

</style>

</head>


<body>


<header>

<h1>
SECURITY MONITOR
</h1>

<div id="updated">
Loading...
</div>

</header>


<div class="container">


<div class="stats">

<div class="stat">
<div class="stat-title">Critical CVE</div>
<div id="critical" class="stat-value critical">0</div>
</div>

<div class="stat">
<div class="stat-title">High CVE</div>
<div id="high" class="stat-value high">0</div>
</div>

<div class="stat">
<div class="stat-title">Medium CVE</div>
<div id="medium" class="stat-value medium">0</div>
</div>

<div class="stat">
<div class="stat-title">Known Exploited</div>
<div id="kev" class="stat-value kev">0</div>
</div>

<div class="stat">
<div class="stat-title">P1 Alerts</div>
<div id="p1" class="stat-value p1">0</div>
</div>

<div class="stat">
<div class="stat-title">News</div>
<div id="news-count" class="stat-value news">0</div>
</div>

</div>


<div class="filters">

<div class="filter-row">

<div class="filter-label">
CVE Vendor
</div>

<button class="vendor-filter active" data-vendor="ALL">
ALL
</button>

<button class="vendor-filter" data-vendor="Microsoft">

</button>

<button class="vendor-filter" data-vendor="Red Hat">
RED HAT
</button>

<button class="vendor-filter" data-vendor="Apple">
APPLE
</button>

</div>


<div class="filter-row">

<div class="filter-label">
CVE Severity
</div>

<button class="severity-filter active" data-severity="ALL">
ALL
</button>

<button class="severity-filter" data-severity="CRITICAL">
CRITICAL
</button>

<button class="severity-filter" data-severity="HIGH">
HIGH
</button>

<button class="severity-filter" data-severity="MEDIUM">
MEDIUM
</button>

</div>


<div class="filter-row">

<div class="filter-label">
News Time
</div>

<button class="time-filter active" data-hours="0">

</button>

</button>

<button class="news-category-filter" data-category="Malware">

</button>

</button>

</button>

</button>

</div>


<div class="filter-row">

    id="search"

>

</div>


<div class="content">


<div>


<div class="section-title">
CVE Monitor
</div>


<div class="panel">

<div class="panel-header">

<span>
CVE MONITOR
</span>

<span
    id="result-count"
    class="panel-count"
>
0 results
</span>

</div>


<div id="cves">

<div class="empty">
Loading...
</div>

</div>

</div>


<div class="section-title">
Cybersecurity News
</div>


<div class="panel">

<div class="panel-header">

<span>
NEWS FEED
</span>

<span
    id="news-result-count"
    class="panel-count"
>
0 results
</span>

</div>

<div class="empty">
Loading...
</div>

</div>

</div>


</div>


<div>


<div class="section-title">
Priority Alerts
</div>


<div class="panel">

<div class="panel-header">

<span>
ALERTS
</span>

<span
    id="alert-count"
    class="panel-count"
>
0
</span>

</div>

Loading...
</div>

</div>

</div>


</div>

</div>


<script>

let allCves = [];

let allNews = [];


let filters = {

    vendor: "ALL",

    severity: "ALL",

    hours: 0,

    category: "ALL",

    search: ""

};


/* =====================================================
   LOAD CVE DATA
===================================================== */

async function loadCveData() {

    const response =
        await fetch(
            "data/security.json?" +
            Date.now()
        );


    if (!response.ok) {

        throw new Error(
            "Could not load security.json"
        );

    }


    const data =
        await response.json();


    allCves =
        data.cves || [];


    updateStatistics();

}


/* =====================================================
   LOAD NEWS DATA
===================================================== */

async function loadNewsData() {

    const response =
        await fetch(
            "data/news.json?" +
            Date.now()
        );


    if (!response.ok) {

        throw new Error(
            "Could not load news.json"
        );

    }


    const data =
        await response.json();


    allNews =
        data.articles || [];


    document
        .getElementById(
            "news-count"
        )
        .innerText =
            allNews.length;

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadData() {

    try {

        await Promise.all([
            loadCveData(),
            loadNewsData()
        ]);


        render();


        document
            .getElementById(
                "updated"
            )
            .innerText =
                "Updated: " +
                new Date()
                    .toLocaleString(
                        "sv-SE"
                    );


    } catch (error) {

        console.error(
            error
        );


        document
            .getElementById(
                "news"
            )
            .innerHTML =
                `
                <div class="error">
                    Unable to load security data.
                    Check GitHub Actions.
                </div>
                `;

    }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics() {

    let critical = 0;

    let high = 0;

    let medium = 0;

    let kev = 0;

    let p1 = 0;


    allCves.forEach(
        cve => {

            const severity =
                cve.cvss?.severity;


            if (
                severity ===
                "CRITICAL"
            ) {

                critical++;

            }


            if (
                severity ===
                "HIGH"
            ) {

                high++;

            }


            if (
                severity ===
                "MEDIUM"
            ) {

                medium++;

            }


            if (
                cve.kev
            ) {

                kev++;

            }


            if (
                cve.priority ===
                "P1"
            ) {

                p1++;

            }

        }
    );


    document
        .getElementById(
            "critical"
        )
        .innerText =
            critical;


    document
        .getElementById(
            "high"
        )
        .innerText =
            high;


    document
        .getElementById(
            "medium"
        )
        .innerText =
            medium;


    document
        .getElementById(
            "kev"
        )
        .innerText =
            kev;


    document
        .getElementById(
            "p1"
        )
        .innerText =
            p1;

}


/* =====================================================
   FILTER CVES
===================================================== */

function getFilteredCves() {

    return allCves.filter(
        cve => {

            if (
                filters.vendor !==
                "ALL"
            ) {

                if (
                    !(cve.vendors || [])
                        .includes(
                            filters.vendor
                        )
                ) {

                    return false;

                }

            }


            if (
                filters.severity !==
                "ALL"
            ) {

                if (
                    cve.cvss?.severity !==
                    filters.severity
                ) {

                    return false;

                }

            }


            if (
                filters.search
            ) {

                const text =
                    JSON.stringify(
                        cve
                    )
                    .toLowerCase();


                if (
                    !text.includes(
                        filters.search
                    )
                ) {

                    return false;

                }

            }


            return true;

        }
    );

}


/* =====================================================
   FILTER NEWS
===================================================== */

function getFilteredNews() {

    const now =
        Date.now();


    return allNews.filter(
        article => {

            if (
                filters.hours > 0
            ) {

                if (
                    !article.published
                ) {

                    return false;

                }


                const published =
                    new Date(
                        article.published
                    )
                    .getTime();


                const age =
                    now -
                    published;


                if (
                    age >
                    filters.hours *
                    60 *
                    60 *
                    1000
                ) {

                    return false;

                }

            }


            if (
                filters.category !==
                "ALL"
            ) {

                if (
                    !(article.categories || [])
                        .includes(
                            filters.category
                        )
                ) {

                    return false;

                }

            }


            if (
                filters.search
            ) {

                const text =
                    JSON.stringify(
                        article
                    )
                    .toLowerCase();


                if (
                    !text.includes(
                        filters.search
                    )
                ) {

                    return false;

                }

            }


            return true;

        }
    );

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const cves =
        getFilteredCves();


    const news =
        getFilteredNews();


    renderCves(
        cves
    );


    renderNews(
        news
    );


    renderAlerts(
        cves,
        news
    );

}


/* =====================================================
   RENDER CVES
===================================================== */

function renderCves(
    cves
) {

    const container =
        document.getElementById(
            "cves"
        );


    document
        .getElementById(
            "result-count"
        )
        .innerText =
            `${cves.length} results`;


    if (
        cves.length === 0
    ) {

        container.innerHTML =
            `
            <div class="empty">
                No CVEs match the selected filters.
            </div>
            `;

        return;

    }


    const sorted =
        cves
            .slice()
            .sort(
                (a, b) => {

                    const priority = {

                        P1: 1,
                        P2: 2,
                        P3: 3,
                        P4: 4

                    };


                    return (
                        priority[
                            a.priority
                        ] || 5
                    ) -
                    (
                        priority[
                            b.priority
                        ] || 5
                    );

                }
            )
            .slice(
                0,
                100
            );


    container.innerHTML = "";


    sorted.forEach(
        cve => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "cve";


            const severity =
                cve.cvss?.severity ||
                "UNKNOWN";


            let severityClass =
                "badge-info";


            if (
                severity ===
                "CRITICAL"
            ) {

                severityClass =
                    "badge-critical";

            }


            if (
                severity ===
                "HIGH"
            ) {

                severityClass =
                    "badge-high";

            }


            if (
                severity ===
                "MEDIUM"
            ) {

                severityClass =
                    "badge-medium";

            }


            let badges = `

                <span
                    class="badge ${severityClass}"
                >
                    ${escapeHtml(
                        severity
                    )}
                </span>

            `;


            if (
                cve.priority
            ) {

                badges += `

                    <span
                        class="badge badge-${escapeHtml(
                            cve.priority.toLowerCase()
                        )}"
                    >
                        ${escapeHtml(
                            cve.priority
                        )}
                    </span>

                `;

            }


            if (
                cve.kev
            ) {

                badges += `

                    <span
                        class="badge badge-kev"
                    >
                        KEV
                    </span>

                `;

            }


            div.innerHTML = `

                <div class="cve-top">

                    <a
                        class="cve-id"
                        href="${escapeAttribute(
                            cve.url
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${escapeHtml(
                            cve.id
                        )}
                    </a>

                    <div class="badges">
                        ${badges}
                    </div>

                </div>


                <div class="description">

                    ${escapeHtml(
                        cve.description
                    )}

                </div>


                <div class="meta">

                    ${
                        cve.cvss?.score
                        ?
                        `
                        <span class="meta-item">
                            CVSS
                            ${escapeHtml(
                                String(
                                    cve.cvss.score
                                )
                            )}
                        </span>
                        `
                        :
                        ""
                    }

                    ${
                        (cve.vendors || [])
                            .map(
                                vendor =>
                                    `
                                    <span class="meta-item">
                                        ${escapeHtml(
                                            vendor
                                        )}
                                    </span>
                                    `
                            )
                            .join("")
                    }

                </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   RENDER NEWS
===================================================== */

function renderNews(
    articles
) {

    const container =
        document.getElementById(
            "news"
        );


    document
        .getElementById(
            "news-result-count"
        )
        .innerText =
            `${articles.length} results`;


    if (
        articles.length === 0
    ) {

        container.innerHTML =
            `
            <div class="empty">
                No news matches the selected filters.
            </div>
            `;

        return;

    }


    const sorted =
        articles
            .slice()
            .sort(
                (a, b) =>
                    new Date(
                        b.published || 0
                    ) -
                    new Date(
                        a.published || 0
                    )
            )
            .slice(
                0,
                100
            );


    container.innerHTML = "";


    sorted.forEach(
        article => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "news-item";


            let badges = "";


            const severity =
                article.severity ||
                "INFO";


            if (
                severity ===
                "CRITICAL"
            ) {

                badges += `
                    <span class="badge badge-critical">
                        CRITICAL
                    </span>
                `;

            } else if (
                severity ===
                "HIGH"
            ) {

                badges += `
                    <span class="badge badge-high">
                        HIGH
                    </span>
                `;

            } else if (
                severity ===
                "MEDIUM"
            ) {

                badges += `
                    <span class="badge badge-medium">
                        MEDIUM
                    </span>
                `;

            }


            if (
                article.priority
            ) {

                badges += `

                    <span
                        class="badge badge-source"
                    >
                        ${escapeHtml(
                            article.priority
                        )}
                    </span>

                `;

            }


            div.innerHTML = `

                <div class="news-top">

                    <a
                        class="news-title"
                        href="${escapeAttribute(
                            article.url
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${escapeHtml(
                            article.title
                        )}
                    </a>

                    <div class="badges">
                        ${badges}
                    </div>

                </div>


                <div class="news-summary">

                    ${escapeHtml(
                        article.summary
                    )}

                </div>


                <div class="meta">

                    <span class="meta-item">
                        ${escapeHtml(
                            article.source
                        )}
                    </span>


                    ${
                        article.published
                        ?
                        `
                        <span class="meta-item">
                            ${formatDate(
                                article.published
                            )}
                        </span>
                        `
                        :
                        ""
                    }


                    ${
                        (article.categories || [])
                            .slice(
                                0,
                                4
                            )
                            .map(
                                category =>
                                    `
                                    <span class="meta-item">
                                        ${escapeHtml(
                                            category
                                        )}
                                    </span>
                                    `
                            )
                            .join("")
                    }


                    ${
                        (article.vendors || [])
                            .slice(
                                0,
                                3
                            )
                            .map(
                                vendor =>
                                    `
                                    <span class="meta-item">
                                        ${escapeHtml(
                                            vendor
                                        )}
                                    </span>
                                    `
                            )
                            .join("")
                    }

                </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   ALERTS
===================================================== */

function renderAlerts(
    cves,
    news
) {

    const alerts = [];


    cves.forEach(
        cve => {

            if (
                cve.priority ===
                "P1"
                ||
                cve.kev
            ) {

                alerts.push({

                    type:
                        "CVE",

                    priority:
                        "P1",

                    title:
                        cve.id,

                    description:
                        cve.description,

                    url:
                        cve.url

                });

            }

        }
    );


    news.forEach(
        article => {

            if (
                article.priority ===
                "P1"
                ||
                article.severity ===
                "CRITICAL"
            ) {

                alerts.push({

                    type:
                        "NEWS",

                    priority:
                        "P1",

                    title:
                        article.title,

                    description:
                        article.summary,

                    url:
                        article.url

                });

            }

        }
    );


    const container =
        document.getElementById(
            "alerts"
        );


    document
        .getElementById(
            "alert-count"
        )
        .innerText =
            alerts.length;


    if (
        alerts.length === 0
    ) {

        container.innerHTML =
            `
            <div class="empty">
                No active priority alerts.
            </div>
            `;

        return;

    }


    container.innerHTML = "";


    alerts
        .slice(
            0,
            50
        )
        .forEach(
            alert => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "alert";


                div.innerHTML = `

                    <div class="alert-title">

                        <a
                            class="news-title"
                            href="${escapeAttribute(
                                alert.url
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${escapeHtml(
                                alert.title
                            )}
                        </a>


                        <span
                            class="badge badge-p1"
                        >
                            ${escapeHtml(
                                alert.type
                            )}
                        </span>

                    </div>


                    <div class="alert-description">

                        ${escapeHtml(
                            alert.description
                        )}

                    </div>

                `;


                container.appendChild(
                    div
                );

            }
        );

}


/* =====================================================
   HELPERS
===================================================== */

function formatDate(
    value
) {

    try {

        return new Date(
            value
        ).toLocaleString(
            "sv-SE"
        );

    } catch {

        return value;

    }

}


function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value || "";


    return div.innerHTML;

}


function escapeAttribute(
    value
) {

    return String(
        value || ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}
